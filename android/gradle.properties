org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Kotlin integrado de AGP 9, en vez del Kotlin Gradle Plugin por proyecto.
#
# Lo exige `file_picker` 11: con AGP 9 o superior NO aplica el plugin de Kotlin
# (`if (!isAgp9OrAbove) { apply plugin: 'org.jetbrains.kotlin.android' }`),
# asume el integrado. Con este flag en `false` nadie compilaba su Kotlin y el
# build moria con `cannot find symbol: FilePickerPlugin` — un error que apunta a
# un archivo generado y no dice nada de Kotlin.
android.builtInKotlin=false
